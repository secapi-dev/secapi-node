name: Publish to npm

# Publishes with npm trusted publishing. GitHub signs a short-lived token for
# this workflow; no NPM_TOKEN is used. A stored token overrides that and was
# rejected with "404 Not Found" on PUT.
#
# One-time setup, as the npm user that owns secapi-node:
#   https://www.npmjs.com/package/secapi-node/access
#   Trusted Publisher → GitHub Actions
#   Organization or user: secapi-dev
#   Repository: secapi-node
#   Workflow filename: release.yml
#   Environment: leave empty

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          check-latest: true
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish when this version is not on npm
        id: publish
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "secapi-node@${version}" version >/dev/null 2>&1; then
            echo "secapi-node@${version} is already on npm"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            npm publish --provenance --access public
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "v${version}" --title "v${version}" --generate-notes
